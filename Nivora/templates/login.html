{% extends 'base.html' %}

{% block content %}
<div class="auth-card">
    <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 0.2rem;">Nivora</h2>
    <p style="color: #666; margin-bottom: 1.5rem;">Iniciar sesión:</p>

    <form action="/login" method="POST" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" name="email" placeholder="nombre@correo.com" autocomplete="off" required aria-invalid="{{ 'true' if field_errors.email else 'false' }}" aria-describedby="email-error">
            <small id="email-error" class="field-error" role="alert" {% if not field_errors.email %}hidden{% endif %}>{{ field_errors.email|default('') }}</small>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="new-password" required aria-invalid="{{ 'true' if field_errors.password else 'false' }}" aria-describedby="password-error">
            <small id="password-error" class="field-error" role="alert" {% if not field_errors.password %}hidden{% endif %}>{{ field_errors.password|default('') }}</small>
        </div>

        <button type="submit" class="btn-yellow">
            Iniciar sesión
        </button>
    </form>

    <div class="auth-links">
        <p><a href="{{ url_for('auth.recuperar_contrasena') }}">¿Olvidaste tu contraseña?</a></p>
        <p>¿No tienes cuenta? <a href="/registro">Regístrate</a></p>
    </div>
</div>
{% endblock %}
