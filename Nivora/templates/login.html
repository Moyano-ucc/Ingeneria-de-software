{% extends 'base.html' %}

{% block content %}
<div class="auth-card">
    <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 0.2rem;">Nivora</h2>
    <p style="color: #666; margin-bottom: 1.5rem;">Iniciar sesión:</p>

    <form action="/login" method="POST">
        <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" name="email" placeholder="nombre@correo.com" required>
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-yellow">
            Iniciar sesión
        </button>
    </form>

    {% if mensaje %}
        <p class="form-message">{{ mensaje }}</p>
    {% endif %}

    <div class="auth-links">
        <p><a href="#">¿Olvidaste tu contraseña?</a></p>
        <p>¿No tienes cuenta? <a href="/registro">Regístrate</a></p>
    </div>
</div>
{% endblock %}
