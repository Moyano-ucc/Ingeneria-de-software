{% extends 'base.html' %}

{% block content %}
<section class="auth-card">
    {% if completado %}
        <h1>Contraseña actualizada</h1>
        <p>{{ mensaje }}</p>
        <a class="btn-yellow" href="{{ url_for('auth.login') }}">Iniciar sesión</a>
    {% else %}
        <h1>Crear contraseña nueva</h1>
        <p>Elige una contraseña de al menos 8 caracteres.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="password">Nueva contraseña</label>
                <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="confirmacion">Confirmar contraseña</label>
                <input id="confirmacion" type="password" name="confirmacion" autocomplete="new-password" minlength="8" required>
            </div>
            <button class="btn-yellow" type="submit">Guardar contraseña</button>
        </form>
        {% if mensaje %}<p class="form-message">{{ mensaje }}</p>{% endif %}
    {% endif %}
</section>
{% endblock %}
