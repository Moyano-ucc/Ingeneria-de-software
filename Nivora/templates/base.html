<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nivora - Aprender</title>
    <style>
        body { background-color: #153866; color: #FFFFFF; font-family: Arial, sans-serif; margin: 0; }
        header { background-color: #122459; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #F2A30F; font-size: 1.5rem; font-weight: bold; }
        .container { padding: 2rem; }
        .card { background-color: #122459; border-left: 4px solid #F2CA0F; padding: 1rem; margin-bottom: 1rem; border-radius: 6px; }
        .btn { background-color: #F2A30F; color: #122459; padding: 0.5rem 1rem; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; }
        .subtext { color: #8C8C8C; }
    </style>
</head>
<body>
    <header>
        <div class="logo">NIVORA</div>
        <nav><a href="/aprender" style="color: #FFFFFF; text-decoration: none;">Aprender</a></nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
