<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora - Aprende Python</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
    <header>
        <a href="/" class="logo">Nivora</a>

        <nav>
            <a href="/aprender">Aprender</a>
            <a href="/practica">Practicar</a>
            {% if session.get('usuario') %}
                <a href="/progreso">Tu progreso</a>
                <a href="/ajustes" class="user-menu">
                    <span class="user-avatar">{{ session['usuario']['nombre'][0]|upper }}</span>
                    {{ session['usuario']['nombre'] }}
                </a>
                <a href="/logout" class="nav-muted">Salir</a>
            {% else %}
                <a href="/login" class="nav-login">Iniciar sesión</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
