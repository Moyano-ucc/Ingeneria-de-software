[pytest]
testpaths = tests
pythonpath = .
addopts = -p no:cacheprovider
markers =
    unit: pruebas unitarias (funciones aisladas, sin base de datos ni HTTP)
    integration: pruebas de integración (servicios y repositorios con SQLite real)
    system: pruebas de sistema (flujos completos a través de HTTP)
    smoke: comprobación rápida de que lo principal funciona
    security: pruebas no funcionales de seguridad
