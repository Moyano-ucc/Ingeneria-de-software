name: Integracion Continua - NIVORA

on:
  push:
    branches: [ "main", "Nivorafinal2" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verificar-codigo:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r Nivora/requirements.txt

    - name: Verificar sintaxis de archivos Python (NIVORA)
      run: |
        python -m compileall Nivora/

    - name: Smoke test de NIVORA (comprobación rápida)
      working-directory: Nivora
      run: python -m pytest -m smoke -q

    - name: Pruebas de regresión de NIVORA (suite completa)
      working-directory: Nivora
      run: python -m pytest -q
